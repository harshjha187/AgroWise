# Production deployment stack: gunicorn (backend) + redis (shared rate-limit
# storage across workers) + nginx (TLS termination + reverse proxy).
# See deploy/DEPLOY.md for the full step-by-step (domain, DNS, first cert).
#
# Copy .env.example to .env and fill in real values before running:
#   docker compose up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: .
    restart: unless-stopped
    environment:
      AGROWISE_API_KEY: ${AGROWISE_API_KEY:?set a real key in .env — do not leave this unset in production}
      AGROWISE_ALLOWED_ORIGINS: ${AGROWISE_ALLOWED_ORIGINS:-}
      AGROWISE_RATELIMIT_STORAGE: redis://redis:6379
      AGROWISE_BEHIND_PROXY: "1"
      AGROWISE_DB_PATH: /data/agrowise.db
    volumes:
      - agrowise_data:/data
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend

  # One-off / periodic certificate issuance & renewal. First run needs the
  # manual certonly command in deploy/DEPLOY.md; after that this renews
  # automatically twice a day (a no-op unless the cert is close to expiry).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'

volumes:
  redis_data:
  agrowise_data:
  certbot_www:
  certbot_certs:
